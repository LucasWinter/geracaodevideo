[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdv"
version = "0.1.0"
description = "Pipeline de geracao de videos para TikTok Shop: catalogo, motor de prompts, briefing diario e montagem"
requires-python = ">=3.10"
# Tudo que o site precisa fica aqui, nao em extras: a Vercel instala a partir
# do pyproject e nao pede extras por nome, entao uma dependencia opcional vira
# ModuleNotFoundError em producao.
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "supabase>=2.10",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
gdv = "gdv.cli:main"

# Declarar fastapi em [project].dependencies ativa a deteccao de framework da
# Vercel, que resolve um unico entrypoint ASGI em vez de funcoes em api/.
[tool.vercel]
entrypoint = "web.asgi:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `web` fica na raiz, fora de src/, e os testes de rota importam dele.
pythonpath = [".", "tests"]
