[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdv"
version = "0.1.0"
description = "Pipeline de geracao de videos para TikTok Shop: catalogo, motor de prompts, briefing diario e montagem"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]
supabase = ["supabase>=2.10"]
web = ["fastapi>=0.115", "jinja2>=3.1", "python-multipart>=0.0.9", "uvicorn>=0.30"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
gdv = "gdv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `web` fica na raiz, fora de src/, e os testes de rota importam dele.
pythonpath = [".", "tests"]
